name: Publish learning studio

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "output/pdf/**"
      - "scripts/build_site.py"
      - "scripts/mark_preview.py"
      - ".github/preview-branches.txt"
      - ".github/workflows/pages.yml"
  # A preview branch requests a rebuild through workflow_dispatch, so the
  # deployment itself always runs from main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: python3 scripts/build_site.py --output _site

      - name: Assemble branch previews
        run: |
          set -euo pipefail
          grep -v '^\s*\(#\|$\)' .github/preview-branches.txt | while read -r branch; do
            if ! git fetch --quiet --depth 1 origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              echo "::warning::Preview branch ${branch} was not found"
              continue
            fi
            git worktree add --quiet --detach "_preview/${branch}" "origin/${branch}"
            python3 "_preview/${branch}/scripts/build_site.py" --output "_site/b/${branch}"
            python3 scripts/mark_preview.py "_site/b/${branch}" --branch "${branch}" --commit "$(git rev-parse "origin/${branch}")"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
