name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Generator and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py

  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, desktop-firefox, ipad-webkit, school-laptop-chromium, phone-portrait-chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install project browser
        run: |
          if [[ "${{ matrix.project }}" == "ipad-webkit" ]]; then
            npx playwright install --with-deps webkit
          elif [[ "${{ matrix.project }}" == "desktop-firefox" ]]; then
            npx playwright install --with-deps firefox
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run build:site
      - run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
